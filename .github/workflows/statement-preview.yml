name: Statement preview

# Draws sample loan statement PDFs on an emulator, to check the layout by eye: on pull requests that touch the PDF,
# or by hand.
on:
  pull_request:
    paths:
      - "app/src/main/java/com/saraltechies/saralmoneytracker/util/StatementPdf.kt"
      - "app/src/main/java/com/saraltechies/saralmoneytracker/util/ReportPdf.kt"
      - "app/src/main/java/com/saraltechies/saralmoneytracker/data/MoneyDb.kt"
      - "app/src/main/java/com/saraltechies/saralmoneytracker/util/PartyStatementPdf.kt"
      - "app/src/main/res/layout/widget_money.xml"
      - "app/src/androidTest/**"
      - ".github/workflows/statement-preview.yml"
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Draw statements on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            ./gradlew installDebug installDebugAndroidTest --stacktrace
            adb shell am instrument -w -e notClass com.saraltechies.saralmoneytracker.StoreScreenshotsTest com.saraltechies.saralmoneytracker.debug.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            grep -q "OK (" instrument.txt
            mkdir -p preview
            adb pull /sdcard/Android/data/com.saraltechies.saralmoneytracker.debug/files/preview/. preview/ || true
      - uses: actions/upload-artifact@v7
        with:
          name: statement-preview
          path: preview/
